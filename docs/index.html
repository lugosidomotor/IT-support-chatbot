<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Developer Support · Demo</title>
  <meta name="description" content="Read-only developer support assistant backed by GitHub, Jira and Confluence via MCP.">
  <meta name="theme-color" content="#eef1f7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='30' r='27' fill='%23f2f4f7' stroke='%23a9b1bb' stroke-width='2'/%3E%3Cellipse cx='22' cy='33' rx='8' ry='9' fill='%230b0d10'/%3E%3Cellipse cx='42' cy='33' rx='8' ry='9' fill='%230b0d10'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/theme.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <aside class="stage" aria-label="Marvin">
      <div class="marvin" data-marvin="full"></div>
    </aside>

    <main class="window glass" id="window">
      <header class="titlebar">
        <div class="marvin-mini" data-marvin="mini" aria-hidden="true"></div>
        <div class="title">
          <h1><span class="title-long">Developer </span>Support</h1>
          <span class="subtitle" id="model-name">…</span>
        </div>
        <ul class="leds" id="leds" aria-label="Knowledge source status">
          <li class="led-item" data-key="github" tabindex="0"><span class="led"></span><span class="led-label">GitHub</span><span class="tip glass" role="tooltip"></span></li>
          <li class="led-item" data-key="jira" tabindex="0"><span class="led"></span><span class="led-label">Jira</span><span class="tip glass" role="tooltip"></span></li>
          <li class="led-item" data-key="confluence" tabindex="0"><span class="led"></span><span class="led-label">Confluence</span><span class="tip glass" role="tooltip"></span></li>
        </ul>
        <div class="actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn" id="export-btn" aria-label="Export conversation" title="Export conversation" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu glass" id="export-menu" role="menu" aria-label="Export format" hidden>
            <button type="button" role="menuitem" data-format="md"><b>Markdown</b><small>.md · readable, with links</small></button>
            <button type="button" role="menuitem" data-format="json"><b>JSON</b><small>.json · structured data</small></button>
          </div>
        </div>
        <button type="button" class="icon-btn" id="new-chat" aria-label="New conversation" title="New conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
      </header>

      <div class="banners" id="banners"></div>
      <div class="banners"><div class="banner" role="note"><b>Static demo.</b>&nbsp;No server, no LLM: every question gets a pre-scripted reply. <a href="https://github.com/lugosidomotor/IT-support-chatbot" target="_blank" rel="noopener">Run the real agent →</a></div></div>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <section class="empty" id="empty">
          <h2>How can I help?</h2>
          <p>Ask about code, incidents or documentation. Answers cite live sources. Read-only.</p>
          <div class="suggestions" id="suggestions"></div>
        </section>
      </div>

      <form class="composer glass" id="composer" autocomplete="off">
        <div class="tray" id="tray" hidden></div>
        <div class="composer-row">
          <button type="button" class="icon-btn attach-btn" id="attach-btn" aria-label="Attach files" title="Attach images or files">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <input type="file" id="file-input" multiple hidden
                 accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.log,.txt,.md,.json,.yaml,.yml,.toml,.ini,.cfg,.conf,.env,.py,.js,.mjs,.ts,.tsx,.jsx,.java,.kt,.go,.rb,.rs,.php,.cs,.c,.h,.cpp,.hpp,.swift,.sql,.sh,.csv,.tsv,.xml,.html,.css,.scss,.properties,.gradle,.tf,.proto,.graphql">
          <label for="input" class="visually-hidden">Message</label>
          <textarea id="input" rows="1" placeholder="Message" maxlength="8000"></textarea>
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="send-btn stop" id="stop-btn" aria-label="Stop" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
      </form>

      <div class="dropzone" id="dropzone" hidden><div class="dropzone-inner">Drop images or files to attach</div></div>
    </main>
  </div>

  <script src="assets/vendor/marked.umd.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/marvin.js"></script>
  <script src="assets/demo.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
